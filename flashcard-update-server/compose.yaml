
services:
  flashcard-updates:
    image: nginx:alpine
    container_name: flashcard-updates
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./releases:/usr/share/nginx/html:ro

    depends_on:
      - flashcard-backup-api

  flashcard-backup-api:
    build:
      context: ./api

    container_name: flashcard-backup-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      BACKUP_DIR: /app/backups

    volumes:
      - ./backups:/app/backups

    expose:
      - "5000"
